    <style>
      #vinmint-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #0f0f1e 0%, #1e1b4b 50%, #0f0f1e 100%);
        transition: opacity 0.4s ease;
      }
      #vinmint-splash.fade { opacity: 0; pointer-events: none; }
      #vinmint-splash img {
        width: 72px; height: 72px; border-radius: 18px;
        animation: vinmint-pulse 1.8s ease-in-out infinite;
      }
      #vinmint-splash h1 {
        margin-top: 20px; font-family: system-ui, -apple-system, sans-serif;
        font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
        background: linear-gradient(to right, #ffffff, #c4b5fd);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #vinmint-splash p {
        margin-top: 6px; font-family: system-ui, -apple-system, sans-serif;
        font-size: 13px; color: #94a3b8;
      }
      @keyframes vinmint-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.92); opacity: 0.7; }
      }
    </style>
  </head>
